  </head>
  <body id="bg">
    <header>
      <nav class="horni-lista">
        <a href="index.html" class="home-link" aria-label="Domů">
          <svg
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M4 10.5L12 3l8 7.5V20a1 1 0 0 1-1 1h-5v-5H10v5H5a1 1 0 0 1-1-1V10.5z"
            />
          </svg>
        </a>
        <div id="menu" class="visible">
          <a href="o-nas.html" class="produkt">O nás</a>
          <a href="produkt.html" class="produkt">Produkt</a>
          <a href="Sole Sens team.html" class="team">Team</a>
          <a href="kontakt.html" class="produkt">Kontakt</a>
        </div>
      </nav>

      <div style="display: flex; justify-content: flex-end">
        <header class="navbar">
          <button class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </header>

        <nav
          class="mobile-menu"
          id="mobileMenu"
          style="display: flex; margin-bottom: 20px"
        >
          <a href="o-nas.html" class="pilulka">O nás</a>

          <a href="produkt.html" class="pilulka">Produkt</a>

          <a href="kontakt.html" class="pilulka">Kontakt</a>
        </nav>
      </div>
    </header>

    <article class="contact-page">
      <div class="contact-wrap">
        <h1 class="nadpis">Kontaktujet nás:</h1>
        <form
          action="https://formsubmit.co/contact@inovasole.com"
          method="POST"
          class="kont kontakt-box"
        >
          <!-- Pole pro jméno -->
          <label for="name" class="p-intro">Jméno:</label>
          <input
            type="text"
            name="name"
            id="name"
            class="text-field"
            required
          />

          <!-- Pole pro e-mail odesílatele -->
          <label for="email" class="p-intro">Váš E-mail:</label>
          <input
            type="email"
            name="email"
            id="email"
            class="text-field"
            required
          />

          <!-- Pole pro zprávu -->
          <label for="message" class="p-intro">Zpráva:</label>
          <textarea
            name="message"
            id="message"
            class="text-field"
            required
          ></textarea>

          <!-- Tlačítko pro odeslání -->
          <button type="submit" class="push-button">Odeslat zprávu</button>
        </form>
      </div>
    </article>

    <footer>
      <div class="ohraniceni">
        <p>
          <strong>Adresa: </strong> InovaSole, Ostrava, Česká republika <br />
          <strong>Kontakt: </strong>
          <a
            href="mailto:contact@inovasole.com"
            style="text-decoration: none; color: inherit"
            >contact@inovasole.com</a
          >
          <br />
        </p>
        <div style="margin-top: 20px; font-size: 0.9em; opacity: 0.7">

            ©2026 InovaSole. Všechna práva vyhrazena.

          </p>
        </div>
      </div>
    </footer>
